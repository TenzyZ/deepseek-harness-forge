# Keyless replay counterpart of forge-auto-mode-ask/cordis.yml: replayed model,
# real pwsh tool, DSH Forge permission presentation, and the Auto Mode risk gate.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: auto-mode-forge
      name: '@deepseek-ai/dsh-experimental-auto-mode-forge'

    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: goal
  name: '@deepseek-ai/dsh-goal'
  disabled: true

- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
  disabled: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  disabled: true

- id: skill
  name: '@deepseek-ai/dsh-skill'
  disabled: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: true

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: false

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: Read & Plan
        description: Read, inspect, search, and plan with no standing write access. Writes require approval.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: Auto Mode
        description: Works automatically inside the workspace and asks before elevated or high-risk actions.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Full Access
        description: Runs without normal filesystem confinement. Use only when you explicitly want unrestricted access.


- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
